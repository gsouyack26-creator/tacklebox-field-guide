name: Update NJ Coastal Report

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coastal-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build daily report
        run: python scripts/update_coastal_report.py
      - name: Validate report
        run: python -m unittest discover -s tests -p "test_coastal_report.py"
      - name: Commit changed report
        run: |
          if git diff --quiet -- coastal-report.json; then
            echo "Report is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coastal-report.json
          git commit -m "Update daily NJ coastal report"
          git push
